name: Feature request
description: Suggest a capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Sinkker makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you want, from the operator's point of view.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve it, including doing nothing.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Worth knowing before proposing: Sinkker targets Cloudflare's free plan, so
        per-request CPU, KV operations and memory are the binding constraints, and
        the resolver has no runtime dependencies by design. Proposals that respect
        those three limits are much easier to accept.
