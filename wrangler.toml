name = "dns-filter-worker"
main = "worker.js"
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "RULES"
id = "c1274ab8f14b4dfcac2cd91af7bfda82"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[[d1_databases]]
binding = "LOGS"
database_name = "dns-logs"
database_id = "295f7331-0f31-42bb-8610-640eb0e38de5"

[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[[preview.kv_namespaces]]
binding = "RULES"
id = "c1274ab8f14b4dfcac2cd91af7bfda82"

[[preview.d1_databases]]
binding = "LOGS"
database_name = "dns-logs"
database_id = "295f7331-0f31-42bb-8610-640eb0e38de5"
